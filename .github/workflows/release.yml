name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version\s*=').Line.Split('"')[1]
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($version -ne $tag) { throw "Tag v$tag does not match Cargo.toml version $version" }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset v3.14
        run: |
          iwr https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix314-binaries.zip
          Expand-Archive -Path wix314-binaries.zip -DestinationPath $env:RUNNER_TEMP\wix314 -Force
          "$env:RUNNER_TEMP\wix314" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build release binary
        run: cargo build --release --bin walltui

      - name: Run tests
        run: cargo test --release

      - name: Check binary size
        run: |
          $size = (Get-Item target/release/walltui.exe).Length / 1MB
          if ($size -gt 5) { throw "Binary too large: $size MB" }

      - name: Build MSI with cargo-wix
        run: cargo wix --no-build

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path target/release/walltui.exe -DestinationPath walltui-x86_64-pc-windows-msvc.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            walltui-x86_64-pc-windows-msvc.zip
            target/wix/walltui-*.msi
          draft: false
