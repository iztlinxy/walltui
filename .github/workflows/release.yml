name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install WiX Toolset v3.11
        run: |
          iwr https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip -OutFile wix311-binaries.zip
          Expand-Archive -Path wix311-binaries.zip -DestinationPath $env:RUNNER_TEMP\wix311 -Force
          "$env:RUNNER_TEMP\wix311" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Check binary size
        run: |
          $size = (Get-Item target/release/walltui.exe).Length / 1MB
          if ($size -gt 5) { throw "Binary too large: $size MB" }

      - name: Check signing secrets
        id: signing
        run: |
          $cert = "${{ secrets.CERT_PFX_PATH }}"
          if ($cert -ne "") {
            echo "available=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "available=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign binary
        if: steps.signing.outputs.available == 'true'
        run: |
          signtool sign /f ${{ secrets.CERT_PFX_PATH }} /p ${{ secrets.CERT_PASSWORD }} /tr http://timestamp.sectigo.com /td sha256 target/release/walltui.exe

      - name: Build MSI with cargo-wix
        run: cargo wix --no-build

      - name: Sign MSI
        if: steps.signing.outputs.available == 'true'
        run: |
          signtool sign /f ${{ secrets.CERT_PFX_PATH }} /p ${{ secrets.CERT_PASSWORD }} /tr http://timestamp.sectigo.com target/wix/walltui-*.msi

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path target/release/walltui.exe -DestinationPath walltui-x86_64-pc-windows-msvc.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            walltui-x86_64-pc-windows-msvc.zip
            target/wix/walltui-*.msi
          draft: true
