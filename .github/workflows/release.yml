name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Check binary size
        run: |
          $size = (Get-Item target/release/walltui.exe).Length / 1MB
          if ($size -gt 5) { throw "Binary too large: $size MB" }

      - name: Sign binary
        if: ${{ secrets.CERT_PFX_PATH != '' }}
        run: |
          signtool sign /f ${{ secrets.CERT_PFX_PATH }} /p ${{ secrets.CERT_PASSWORD }} /tr http://timestamp.sectigo.com /td sha256 target/release/walltui.exe

      - name: Build MSI with cargo-wix
        run: cargo wix --no-build

      - name: Sign MSI
        if: ${{ secrets.CERT_PFX_PATH != '' }}
        run: |
          signtool sign /f ${{ secrets.CERT_PFX_PATH }} /p ${{ secrets.CERT_PASSWORD }} /tr http://timestamp.sectigo.com target/wix/walltui-*.msi

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path target/release/walltui.exe -DestinationPath walltui-x86_64-pc-windows-msvc.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            walltui-x86_64-pc-windows-msvc.zip
            target/wix/walltui-*.msi
          draft: true

  winget:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit to WinGet
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $github = Get-Content '${{ github.event_path }}' | ConvertFrom-Json
          $installerUrl = $github.release.assets | Where-Object { $_.name -match 'windows.msi' } | Select -ExpandProperty browser_download_url -First 1
          .\wingetcreate.exe update WallTUI.WallTUI -s -v $github.release.tag_name -u $installerUrl -t ${{ secrets.WINGET_PAT }}
