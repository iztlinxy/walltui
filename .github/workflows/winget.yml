name: Submit to WinGet

on:
  release:
    types: [published]

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Download wingetcreate
        run: iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to WinGet
        run: |
          $github = Get-Content '${{ github.event_path }}' | ConvertFrom-Json
          $asset = $github.release.assets | Where-Object { $_.name -match '\.msi$' } | Select-Object -First 1
          if (-not $asset) { throw "No MSI asset found in release" }
          $installerUrl = $asset.browser_download_url
          $version = $github.release.tag_name -replace '^v',''
          Write-Host "Submitting WallTUI $version from $installerUrl"
          .\wingetcreate.exe update WallTUI.WallTUI -s -v $version -u $installerUrl -t ${{ secrets.WINGET_PAT }}
