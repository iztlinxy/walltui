[package]
name = "walltui"
version = "1.4.1"
default-run = "walltui"
description = "Terminal Wallpaper Manager"
authors = ["WallTUI"]
license = "MIT"
repository = "https://github.com/iztlinxy/walltui"
edition = "2024"

[package.metadata.wix]
upgrade-guid = "B37F4A49-461F-4D91-9735-74EC55E1DCAC"
path-guid = "E617E50C-6A48-42EF-8015-F8CF61FF4C0A"
license = false
eula = false

[dependencies]
color-eyre = { version = "0.6.3", default-features = false }
serde_json = "1.0"
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures-util = "0.3"
dirs = "6"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
peak_alloc = { version = "0.2", optional = true }

[features]
bench = ["peak_alloc"]

[[bin]]
name = "walltui"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# See PHASE_10_WINDOWS_DISTRIBUTION.md for size targets.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
