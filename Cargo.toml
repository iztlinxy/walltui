[package]
name = "walltui"
version = "1.1.0"
description = "A Ratatui Hello World app"
authors = ["Josh McKinney <joshka@users.noreply.github.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = { version = "0.6.3", default-features = false }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures-util = "0.3"
dirs = "6"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[patch.crates-io]
zune-jpeg = { path = "vendor/zune-jpeg" }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# See PHASE_10_WINDOWS_DISTRIBUTION.md for size targets.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
